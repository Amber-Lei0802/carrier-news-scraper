# ============================================================
# US Carrier Tracker - Configuration
# All user-facing settings live here. No code changes needed.
# ============================================================

# --- Keyword filtering (pre-filter before AI enrichment) ---
# An item must match the carrier filter to be kept.
filters:
  # Carrier-related keywords — an item must contain at least ONE of these
  # (case-insensitive match on title + summary)
  carrier_keywords:
    - "aircraft carrier"
    - "carrier"
    - "CVN"
    - "carrier strike group"
    - "CSG"
    - "flight deck"
    - "Ford-class"
    - "Nimitz-class"
    - "USS Gerald R. Ford"
    - "USS Nimitz"
    - "USS Dwight D. Eisenhower"
    - "USS Carl Vinson"
    - "USS Theodore Roosevelt"
    - "USS Abraham Lincoln"
    - "USS George Washington"
    - "USS John C. Stennis"
    - "USS Harry S. Truman"
    - "USS Ronald Reagan"
    - "USS George H.W. Bush"
    - "USS John F. Kennedy"
    - "USS Enterprise"
    - "USS Doris Miller"
    - "carrier deployment"
    - "carrier overhaul"
    - "RCOH"
    - "PSA"

  # Hard-blocked keywords — items containing any of these are dropped
  # (used to exclude obvious non-carrier content that mentions "carrier"
  # in other contexts, e.g. "aircraft carrier" on a submarine page about
  # carrying missiles — keep this list conservative)
  blocked_keywords:
    - "submarine"
    - "SSN"
    - "SSBN"
    - "destroyer"
    - "DDG"
    - "cruiser"
    - "CG"
    - "frigate"
    - "FFG"
    - "Littoral Combat Ship"
    - "LCS"
    - "amphibious"
    - "LPD"
    - "LHD"
    - "LHA"

  # Minimum required matches from carrier_keywords
  # Higher = stricter (fewer false positives, but might miss some edge cases)
  min_keyword_matches: 2

  # Title must contain at least one carrier keyword?
  # If true, an item whose title has ZERO carrier keywords is dropped,
  # even if the body mentions carriers. This reduces false positives
  # where a non-carrier article briefly mentions a carrier in context.
  require_title_match: false

  # Ambiguous abbreviations — only count these when found in
  # carrier-rich context (i.e. at least one other carrier keyword matches).
  # Prevents "PSA" or "CSG" from triggering on non-carrier articles.
  ambiguous_abbreviations:
    - "PSA"
    - "CSG"
    - "CVN"

# --- AI enrichment settings ---
ai:
  enabled: true
  # Model priority — the client auto-falls back on 429 / quota
  model: "gemini-3.6-flash"
  rate_limit_seconds: 8
  # The "batch" here is conceptual — we send all news items in one
  # prompt for synthesis into a single integrated report.
  max_items_per_report: 50
  max_output_tokens: 4096
  temperature: 0.3

# --- Storage ---
storage:
  provider: "local"       # local json + markdown output
  raw_data_dir: "data/raw"
  reports_dir: "reports"
  seen_urls_file: "data/seen_urls.json"

# --- Sources to enable ---
sources:
  - name: "USNI News"
    enabled: true
    base_url: "https://news.usni.org/"
  - name: "Lockheed Martin"
    enabled: true
    base_url: "https://news.lockheedmartin.com/"
  - name: "US Navy News"
    enabled: true
    base_url: "https://www.navy.mil/News/"
  - name: "Navy Times"
    enabled: true
    base_url: "https://www.navytimes.com/"

# --- Schedule info (for reference; actual cron in .github/workflows) ---
schedule:
  frequency: "daily"
  cron: "0 12 * * *"   # 12:00 UTC daily
