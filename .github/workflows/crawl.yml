# ============================================================
# GitHub Actions 工作流 - 美国航母每日动态简报
# 每日 UTC 06:00（北京时间 14:00）自动运行
# ============================================================

name: US Carrier Daily Briefing

on:
  schedule:
    # UTC 06:00 = 北京时间 14:00（可自由调整）
    - cron: "0 6 * * *"
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write          # 允许提交报告文件到仓库

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. 拉取代码 ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. 安装 Python ──
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. 安装依赖 ──
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. 运行抓取 + AI 简报 + 邮件推送 ──
      - name: Run carrier briefing agent
        env:
          # 大模型密钥（二选一，按你配置的 provider 填写）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # 邮件密钥
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python main.py

      # ── 5. 提交生成的报告到仓库 ──
      - name: Commit report to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          git diff --cached --quiet || git commit -m "chore: daily carrier briefing $(date +%Y-%m-%d)"
          git push
